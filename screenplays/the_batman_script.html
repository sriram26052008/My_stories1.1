<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Batman - Official Script Book</title>
  <style>
    :root { --bg:#111; --page:#fff; --text:#111; --muted:#777; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
    header { position:sticky; top:0; z-index:10; padding:14px 20px; background:#000; color:#fff; border-bottom:1px solid #333; }
    header h1 { margin:0; font-size:20px; }
    header p { margin:4px 0 0; color:#bbb; font-size:13px; }
    main { max-width:900px; margin:30px auto; padding:0 16px; }
    .page { background:var(--page); margin:0 auto 28px; padding:55px 60px; min-height:1000px; box-shadow:0 4px 18px rgba(0,0,0,.35); position:relative; }
    .page-number { position:absolute; top:18px; right:24px; color:var(--muted); font-size:12px; }
    pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:"Courier New",Courier,monospace; font-size:13px; line-height:1.45; }
    @media (max-width:700px) {
      main { margin:10px auto; padding:0 6px; }
      .page { padding:42px 22px; min-height:auto; margin-bottom:12px; }
      pre { font-size:11px; line-height:1.4; }
    }
    @media print {
      body { background:#fff; }
      header { display:none; }
      main { max-width:none; margin:0; padding:0; }
      .page { box-shadow:none; margin:0; page-break-after:always; min-height:auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>The Batman - The Official Script Book</h1>
    <p>HTML conversion of the provided PDF</p>
  </header>
  <main>
    <!-- Full 330-page screenplay text from the converted PDF is included here. -->
  </main>
</body>
</html>
